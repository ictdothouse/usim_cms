# Architecture review fix (P1 — connection pool risk): without this, total
# Postgres backend connections scale as (control_pool × replicas) +
# (tenant_pool × tenants × replicas) — e.g. 3 API replicas × 10 tenants
# already hits ~210 connections. PgBouncer sits in front so every replica's
# node-pg pool talks to PgBouncer instead of Postgres directly, removing the
# "× replicas" multiplier: replicas share the SAME per-database backend pool
# here instead of each replica keeping its own.
#
# pool_mode = session, deliberately NOT transaction: apps/api sets
# `SET SESSION app.authenticated = ...` per request (plugins/tenant.ts /
# plugins/auth.ts) to drive the pages/posts RLS policies. Transaction-mode
# pooling only resets session state between transactions when
# server_reset_query_always is on (off by default) — without that, a
# SET SESSION value can leak onto a LATER, unrelated client's transaction
# when PgBouncer hands the same backend connection to someone else. Session
# mode ties one backend connection to one client for its whole session,
# matching how apps/api already holds one pooled client per request
# (tenant.ts's onResponse release) — safe, no app code changes needed.
[databases]
; Wildcard: every tenant gets its own Postgres database
; (tenant_<host>, see tenant-pool.ts's tenantDbName), created dynamically —
; PgBouncer forwards whatever dbname the client requested unchanged, so new
; tenants need zero PgBouncer config changes.
; Do not force `user=` here: SCRAM pass-through needs the backend username to
; remain the authenticated client's username.
;
; No password= here (deliberately, since a security audit found a hardcoded
; one) — PgBouncer falls back to auth_file's entry for usim_cms_app to
; authenticate the backend connection to Postgres too, using the same SCRAM
; verifier it uses to verify incoming clients below.
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; SCRAM-SHA-256; auth_file must contain the matching PostgreSQL SCRAM verifier
; for usim_cms_app so PgBouncer can authenticate both client and server legs.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Lets the app's own role run SHOW VERSION/SHOW POOLS against the special
; admin "pgbouncer" database — needed for docker-compose.yml's healthcheck
; (confirmed live: without this, PgBouncer logs "pooler error: not allowed"
; and the healthcheck never turns healthy, even though the real tenant/
; control-plane database connections work fine).
stats_users = usim_cms_app
pool_mode = session
max_client_conn = 500
; Per-DISTINCT-dbname cap (PgBouncer pools per database name even under a
; wildcard match, not one shared budget across every tenant) — size this so
; (default_pool_size × expected concurrent-active tenants) stays under
; Postgres's own max_connections. Tune both together; see CLAUDE.md.
default_pool_size = 8
reserve_pool_size = 2
