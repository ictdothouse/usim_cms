server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite's build hashes every filename under assets/ ([name]-[hash].js/css) —
  # same "unique name never reused, safe to cache forever" reasoning already
  # applied to apps/api's /uploads/* (see docker-compose.yml/storage.ts).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
