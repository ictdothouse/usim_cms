services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: usim_cms
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, only on an empty data dir: creates the non-superuser
      # usim_cms_app role the RLS policies require (see CLAUDE.md / the
      # script's own header for why superuser connections can't use them).
      - ./apps/api/scripts/setup-db-role.sql:/docker-entrypoint-initdb.d/01-setup-db-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://usim_cms_app:usim_cms_app@db:5432/usim_cms
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PORT: 3000
      # The api's Dockerfile bakes NODE_ENV=production, which trips index.ts's
      # own boot-time guard (`ADMIN_ORIGIN must be set in production`) unless
      # this is set — the browser reaches the admin container directly on
      # ADMIN_PORT here (no proxy in front for local/dev compose runs).
      # Override to the real https://<ADMIN_DOMAIN> once behind the `proxy`
      # service in production.
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:${ADMIN_PORT:-5173}}
      # Static export renders pages through the frontend container.
      FRONTEND_INTERNAL_URL: http://frontend:4321
      # Caddy's Admin API, docker-internal only (never published — see the
      # proxy service below). Harmless to always set: proxy-sync.ts's calls
      # are only ever made when a superadmin turns the Settings "Domain &
      # SSL Automation" switch on (default off).
      CADDY_ADMIN_URL: http://proxy:2019
    ports:
      # Host port overridable via .env's API_PORT (install.sh writes this
      # when the default 3000 is already taken on the host) — a separate
      # docker-compose.override.yml is NOT used for this: Compose
      # concatenates list-valued keys like `ports` across files instead of
      # replacing them, so an override here would bind BOTH ports at once.
      - "${API_PORT:-3000}:3000"
    volumes:
      - api-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Internal Docker network call, api container-to-container — not the
      # browser-facing VITE_API_URL the admin's build uses.
      API_URL: http://api:3000
      PORT: 4321
    ports:
      - "${FRONTEND_PORT:-4321}:4321"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost:4321}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-5173}:80"

  # Public-facing reverse proxy + TLS. Auto-issues/renews Let's Encrypt certs
  # for ADMIN_DOMAIN/API_DOMAIN/TENANT_DOMAINS (see .env.example) by default —
  # swap a site block in ./Caddyfile to `tls <cert> <key>` and uncomment the
  # ./certs mount below if USIM ICT provides its own certificate instead.
  proxy:
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --resume
    restart: unless-stopped
    depends_on:
      - admin
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      TENANT_DOMAINS: ${TENANT_DOMAINS:-tenant.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # - ./certs:/etc/caddy/certs:ro

volumes:
  db-data:
  api-uploads:
  caddy-data:
  caddy-config:
