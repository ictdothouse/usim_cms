services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: usim_cms
    networks:
      - ucms-net
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, only on an empty data dir: creates the non-superuser
      # usim_cms_app role the RLS policies require (see CLAUDE.md / the
      # script's own header for why superuser connections can't use them).
      - ./apps/api/scripts/setup-db-role.sql:/docker-entrypoint-initdb.d/01-setup-db-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Public-facing reverse proxy + TLS. Auto-issues/renews Let's Encrypt certs
  # for ADMIN_DOMAIN/API_DOMAIN/TENANT_DOMAINS (see .env.example) by default —
  # swap a site block in ./Caddyfile to `tls <cert> <key>` and uncomment the
  # ./certs mount below if USIM ICT provides its own certificate instead.
  #
  # api/frontend/admin used to live in THIS file. They moved to
  # docker-compose.release.yml (see scripts/deploy.sh) so they can be
  # blue-green deployed — started under a `ucms-blue`/`ucms-green` project
  # name, health-checked, and promoted (Caddy's routes flipped to them)
  # with zero downtime, while db/proxy here stay up the whole time as the
  # one always-on "base" every color of release shares. Plain single-box
  # use without blue-green still works: run `docker compose up -d --build`
  # here for db+proxy, then `scripts/deploy.sh` once for the app tier —
  # see CLAUDE.md's Deployment section.
  proxy:
    image: caddy:2-alpine
    # No --resume: this proxy container's Caddy config is always adapted
    # fresh from ./Caddyfile on every start. syncCaddy's dynamic tenant/cert
    # routes (proxy-sync.ts) are re-pushed on top by the api container's own
    # boot self-heal, not persisted via Caddy's autosave — --resume would
    # otherwise make Caddy ignore Caddyfile edits (including a manual
    # cert-swap restart) on every restart after the first.
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    restart: unless-stopped
    networks:
      - ucms-net
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      TENANT_DOMAINS: ${TENANT_DOMAINS:-tenant.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # - ./certs:/etc/caddy/certs:ro

# Named (not project-scoped) so docker-compose.release.yml's api/frontend/
# admin — started under a DIFFERENT compose project name for blue-green —
# can join this same network and reach db/proxy by their bare service name.
networks:
  ucms-net:
    name: ucms-net

volumes:
  db-data:
  caddy-data:
  caddy-config:
  # Named (not project-scoped), same reasoning as ucms-net above: local-disk
  # uploads (apps/api/src/storage.ts) must survive a blue-green color swap —
  # ucms-blue/ucms-green are different compose projects and would otherwise
  # each get their own uploads volume. Referenced as `external: true` from
  # docker-compose.release.yml's api service.
  ucms-uploads:
    name: ucms-uploads
