services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: usim_cms
    networks:
      - ucms-net
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, only on an empty data dir: creates the non-superuser
      # usim_cms_app role the RLS policies require (see CLAUDE.md / the
      # script's own header for why superuser connections can't use them).
      - ./apps/api/scripts/setup-db-role.sql:/docker-entrypoint-initdb.d/01-setup-db-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Connection-pool proxy sitting between every apps/api replica and
  # Postgres — see ./pgbouncer/pgbouncer.ini for why (session pooling, not
  # transaction) and the sizing tradeoff. Always-on alongside db, same as
  # proxy below: neither api replica count nor a blue/green color swap
  # should change how many real backend connections Postgres carries.
  # docker-compose.release.yml's api service points DATABASE_URL here
  # (pgbouncer:6432) instead of db:5432 directly. edoburu/pgbouncer (not the
  # stale, years-unmaintained pgbouncer/pgbouncer image): it leaves a
  # mounted pgbouncer.ini alone instead of overwriting it with its own
  # env-var-generated config, and ships psql for the healthcheck below.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ucms-net
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD='' psql -h 127.0.0.1 -p 6432 -U usim_cms_app -d pgbouncer -c 'SHOW VERSION' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared cache for public (anonymous) reads — see apps/api/src/cache.ts.
  # Always-on base tier, same reasoning as pgbouncer above: every api
  # replica/blue-green color must read/invalidate the SAME cache, not one
  # each. Optional — REDIS_URL unset means apps/api falls back to hitting
  # Postgres every time (correct, just not load-reduced). No persisted
  # volume: it's a cache, losing it on restart just means a cold refill.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - ucms-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reverse proxy for the app tier's own blue/green routing — NOT necessarily
  # the public-facing TLS terminator. Default (PROXY_BIND_HTTP/HTTPS unset)
  # still binds host 80/443 directly for a box where Caddy owns the edge and
  # auto-issues Let's Encrypt certs (see ./Caddyfile). On a box that already
  # runs its own nginx/other TLS proxy in front of OTHER apps (80/443 already
  # taken), set PROXY_BIND_HTTP=127.0.0.1:8090:80 and PROXY_BIND_HTTPS=
  # 127.0.0.1:8091:443 in .env instead — Caddy then only listens on
  # loopback-only ports, `auto_https off` in ./Caddyfile skips ACME/TLS
  # entirely (the outer nginx already terminates TLS), and that nginx gets an
  # ordinary `proxy_pass http://127.0.0.1:8090;` vhost per domain (preserving
  # the Host header, same as Caddy's own reverse_proxy does) added to ITS OWN
  # config — outside this repo, since it's shared with other apps.
  #
  # api/frontend/admin used to live in THIS file. They moved to
  # docker-compose.release.yml (see scripts/deploy.sh) so they can be
  # blue-green deployed — started under a `ucms-blue`/`ucms-green` project
  # name, health-checked, and promoted (Caddy's routes flipped to them)
  # with zero downtime, while db/proxy here stay up the whole time as the
  # one always-on "base" every color of release shares. Plain single-box
  # use without blue-green still works: run `docker compose up -d --build`
  # here for db+proxy, then `scripts/deploy.sh` once for the app tier —
  # see CLAUDE.md's Deployment section.
  proxy:
    image: caddy:2-alpine
    # No --resume: this proxy container's Caddy config is always adapted
    # fresh from ./Caddyfile on every start. syncCaddy's dynamic tenant/cert
    # routes (proxy-sync.ts) are re-pushed on top by the api container's own
    # boot self-heal, not persisted via Caddy's autosave — --resume would
    # otherwise make Caddy ignore Caddyfile edits (including a manual
    # cert-swap restart) on every restart after the first.
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    restart: unless-stopped
    networks:
      - ucms-net
    ports:
      - "${PROXY_BIND_HTTP:-80:80}"
      - "${PROXY_BIND_HTTPS:-443:443}"
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      TENANT_DOMAINS: ${TENANT_DOMAINS:-tenant.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # - ./certs:/etc/caddy/certs:ro

# Named (not project-scoped) so docker-compose.release.yml's api/frontend/
# admin — started under a DIFFERENT compose project name for blue-green —
# can join this same network and reach db/proxy by their bare service name.
networks:
  ucms-net:
    name: ucms-net

volumes:
  db-data:
  caddy-data:
  caddy-config:
  # Named (not project-scoped), same reasoning as ucms-net above: local-disk
  # uploads (apps/api/src/storage.ts) must survive a blue-green color swap —
  # ucms-blue/ucms-green are different compose projects and would otherwise
  # each get their own uploads volume. Referenced as `external: true` from
  # docker-compose.release.yml's api service.
  ucms-uploads:
    name: ucms-uploads
