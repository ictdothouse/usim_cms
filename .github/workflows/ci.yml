name: CI

# Only main and v* tags publish images (the publish job below); deliberately
# no workflow_dispatch, which would let any branch push images under this
# repository's name.
on:
  push:
    branches: [main]
    # Release tags run the full CI too: the publish job needs it green.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @ucms/api test
      - run: pnpm --filter @ucms/admin test
      - run: pnpm --filter @ucms/frontend test
      # monitor/ isn't a workspace package; its tests run straight on node.
      - run: node --test monitor/*.test.js scripts/*.test.mjs

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usim_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d usim_cms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://usim_cms_app:usim_cms_app@127.0.0.1:5432/usim_cms
      DATABASE_PROVISIONER_URL: postgres://usim_cms_provisioner:usim_cms_provisioner@127.0.0.1:5432/usim_cms
      SESSION_SECRET: ci-only-session-secret
      ADMIN_ORIGIN: http://localhost:5173
      PORT: 3001
      E2E_API_URL: http://localhost:3001
      E2E_ADMIN_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3001
      VITE_FRONTEND_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Configure isolated PostgreSQL roles
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/usim_cms
        run: pnpm --filter @ucms/api exec tsx scripts/setup-db-role.ts
      - name: Start API
        run: |
          pnpm --filter @ucms/api exec tsx src/index.ts > "$RUNNER_TEMP/ucms-api.log" 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ucms-api.log"
          exit 1
      # The Live Edit test frames the real site; server.mjs only allows that
      # for ADMIN_ORIGIN (job env above) via its frame-ancestors CSP.
      - name: Start frontend
        working-directory: apps/frontend
        run: |
          PORT=4321 HOST=127.0.0.1 API_URL=http://127.0.0.1:3001 node server.mjs > "$RUNNER_TEMP/ucms-frontend.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:4321/; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ucms-frontend.log"
          exit 1
      - name: Install Playwright Chromium
        run: pnpm --filter @ucms/admin exec playwright install --with-deps chromium
      - name: Run browser smoke tests against isolated PostgreSQL
        run: pnpm --filter @ucms/admin test:e2e

  # Builds the api/frontend/admin images for a main commit or a release tag
  # (v1.2.3, also tagged with that version), only after build and e2e pass,
  # and pushes them to this repository's container registry
  # (ghcr.io/<owner>/<repo>/{api,frontend,admin}); a server with
  # UCMS_IMAGE_REPO set in .env then pulls them instead of building. Off until
  # the repository variable UCMS_PUBLISH_IMAGES is "true" (Settings > Secrets
  # and variables > Actions > Variables). The logic lives in
  # scripts/build-images.sh, which GitLab CI (.gitlab-ci.yml) or any other CI
  # runs the same way.
  publish:
    needs: [build, e2e]
    if: github.event_name == 'push' && vars.UCMS_PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Plain docker login, no third-party action: this token can push the
      # images production servers run.
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Registry paths must be lowercase.
      - run: UCMS_IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}" bash scripts/build-images.sh --push
        env:
          # A release tag push (v1.2.3) also tags the images with that version.
          UCMS_IMAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
