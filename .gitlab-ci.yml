stages: [test, publish]

# Same checks as .github/workflows/ci.yml's build job, on every branch and tag
# pipeline. publish-images is in a later stage, so it never runs unless this
# passed. The browser e2e job is GitHub-only for now.
test:
  stage: test
  image: node:26
  before_script:
    # Node 25+ ships without corepack; same pin as the Dockerfiles.
    - npm install -g corepack@0.36.0 && corepack enable
  script:
    - pnpm install --frozen-lockfile
    - pnpm audit
    - pnpm lint
    - pnpm typecheck
    - pnpm build
    - pnpm --filter @ucms/api test
    - pnpm --filter @ucms/admin test
    - pnpm --filter @ucms/frontend test
    - node --test monitor/*.test.js scripts/*.test.mjs

# Builds the api/frontend/admin images once per commit on the default branch,
# and once per release tag (v1.2.3, also tagged with that version), and
# pushes them to this project's container registry
# ($CI_REGISTRY_IMAGE/{api,frontend,admin}); a server with UCMS_IMAGE_REPO set
# in .env then pulls them instead of building. Off until the CI/CD variable
# UCMS_PUBLISH_IMAGES is "true" (Settings > CI/CD > Variables). Needs a runner
# that can run Docker-in-Docker (privileged). The logic lives in
# scripts/build-images.sh, which GitHub Actions or any other CI runs the same
# way.
publish-images:
  stage: publish
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $UCMS_PUBLISH_IMAGES == "true" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v/)
  before_script:
    - apk add --no-cache bash
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - UCMS_IMAGE_REPO="$CI_REGISTRY_IMAGE" UCMS_IMAGE_TAG="$CI_COMMIT_SHA" UCMS_IMAGE_VERSION="${CI_COMMIT_TAG:-}" bash scripts/build-images.sh --push
